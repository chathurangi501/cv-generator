<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Sri Lankan CV & Internship Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-xl w-full bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl p-8 sm:p-12 text-center shadow-2xl text-white space-y-8">
        
        <!-- Logo / Icon -->
        <div class="w-20 h-20 mx-auto bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/55 transform hover:scale-105 transition duration-300">
            <i class="fa-solid fa-file-lines text-3xl text-white"></i>
        </div>

        <!-- Heading & Description -->
        <div class="space-y-3">
            <h1 class="text-2xl sm:text-4xl font-bold tracking-tight">Sri Lankan CV & Internship Generator</h1>
            <p class="text-slate-300 text-sm sm:text-base leading-relaxed">
                Create professional, ATS-friendly resumes and apply for your dream internships instantly without any hassle.
            </p>
        </div>

        <!-- Action Buttons (Login / Register / Get Started) -->
        <div class="flex flex-col sm:flex-row justify-center gap-4">
            <a href="login.html" class="inline-flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-white font-semibold px-6 py-3.5 rounded-xl border border-slate-600 transition-all duration-300 text-sm">
                <i class="fa-solid fa-right-to-bracket"></i> Login
            </a>
            <a href="register.html" class="inline-flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-3.5 rounded-xl shadow-lg shadow-blue-600/40 transition-all duration-300 text-sm">
                <i class="fa-solid fa-user-plus"></i> Register
            </a>
        </div>

        <!-- Footer Note -->
        <div class="text-xs text-slate-400 pt-4 border-t border-white/10">
            Designed for Localhost & Offline Use
        </div>

    </div>

</body>
</html>
