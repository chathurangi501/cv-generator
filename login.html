<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CV Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl p-8 shadow-2xl text-white space-y-6 relative">
       <!-- Home Page Button (Top Right) -->
       <a href="home.html" class="absolute top-6 right-6 bg-white/10 hover:bg-white/20 text-slate-200 hover:text-white px-3 py-1.5 rounded-xl text-xs font-semibold transition border border-white/20 flex items-center gap-1.5 shadow-sm">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
       </a>
       <div class="text-center space-y-2 pt-2">
            <div class="w-14 h-14 mx-auto bg-blue-600 rounded-xl flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-right-to-bracket text-2xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold">Welcome Back</h1>
            <p class="text-slate-300 text-xs">Login to access your CV generator</p>
        </div>

        <div id="alertBox" class="hidden p-3 text-xs rounded-lg bg-red-500/20 border border-red-500 text-red-200 text-center"></div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Email Address</label>
                <input type="email" id="loginEmail" required placeholder="" class="w-full p-3 bg-white/5 border border-white/20 rounded-xl text-sm focus:outline-none focus:border-blue-500 transition text-white placeholder-slate-400">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Password</label>
                <input type="password" id="loginPassword" required placeholder="" class="w-full p-3 bg-white/5 border border-white/20 rounded-xl text-sm focus:outline-none focus:border-blue-500 transition text-white placeholder-slate-400">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-lg transition duration-300 text-sm cursor-pointer">
                Login
            </button>
        </form>

        <p class="text-center text-xs text-slate-300">
            Don't have an account? <a href="register.html" class="text-blue-400 font-semibold hover:underline">Register here</a>
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const alertBox = document.getElementById('alertBox');

            const basePath = window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);

            // 1. Admin check (Hardcoded admin credentials)
            if (email === "admin@gmail.com" && password === "admin123") {
                localStorage.setItem("isAdminLoggedIn", "true");
                window.location.href = window.location.origin + basePath + 'admin.html';
                return;
            }

            // 2. Regular Registered Users Check
            let users = JSON.parse(localStorage.getItem('cv_users')) || [];
            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                localStorage.setItem('cv_logged_user', JSON.stringify(user));
                // Redirect to home.html instead of index.html after successful login
                window.location.href = window.location.origin + basePath + 'home.html';
            } else {
                alertBox.textContent = "Invalid email or password! (Admin: admin@gmail.com / admin123)";
                alertBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
